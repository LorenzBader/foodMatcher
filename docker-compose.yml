services:
  # 1. MongoDB (Using Pre-built Official Image)
  mongo:
    image: mongo:latest
    container_name: foodmatcher_db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PW}
    volumes:
      - mongo-data:/data/db

  # 2. Backend Service
  backend:
    build: ./backend
    container_name: foodmatcher_backend
    ports:
      - "3000:3000"
      - "3001:3001"
    # Load environment variables from the file
    env_file:
      - .env
    environment:
      - DB_URL=mongodb://${DB_USER}:${DB_PW}@mongo:27017/foodmatcher?authSource=admin
    depends_on:
      - mongo

  # 3. Frontend Service
  frontend:
    build: ./frontend
    container_name: foodmatcher_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data: